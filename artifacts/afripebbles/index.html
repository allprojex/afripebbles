  <body>
    <!--
      Static shell shown only until React mounts and replaces this div's
      contents (createRoot().render() overwrites all children — no
      hydration is used here, so there is no mismatch risk). Keeps the
      first paint from being a blank white screen while the JS bundle
      downloads/parses; intentionally no animation so it can't itself
      delay anything.
    -->
    <div id="root">
      <div class="min-h-screen flex items-center justify-center bg-background">
        <span class="font-serif text-2xl text-foreground/60 tracking-wide">AfriPebbles</span>
      </div>
    </div>
