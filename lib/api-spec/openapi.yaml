components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ContentStatus:
      type: string
      enum: [draft, scheduled, published, archived]

    EnquiryStatus:
      type: string
      enum: [new, read, resolved, archived]

    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
      required:
        - id
        - email
        - role

    CountBreakdown:
      type: object
      properties:
        total:
          type: number
        published:
          type: number
        draft:
          type: number
      required:
        - total
        - published
        - draft

    RecentlyUpdatedItem:
      type: object
      properties:
        contentType:
          type: string
          enum: [product, podcast_episode, blog_post, curated_pick]
        id:
          type: number
        title:
          type: string
        status:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - contentType
        - id
        - title
        - status
        - updatedAt

    DashboardSummary:
      type: object
      properties:
        products:
          $ref: "#/components/schemas/CountBreakdown"
        preorderProducts:
          type: number
        podcastEpisodes:
          $ref: "#/components/schemas/CountBreakdown"
        recommendations:
          $ref: "#/components/schemas/CountBreakdown"
        articles:
          $ref: "#/components/schemas/CountBreakdown"
        newsletterSubscribers:
          type: number
        contactEnquiries:
          type: number
        collaborationEnquiries:
          type: number
        productEnquiries:
          type: number
        recentlyUpdated:
          type: array
          items:
            $ref: "#/components/schemas/RecentlyUpdatedItem"
      required:
        - products
        - preorderProducts
        - podcastEpisodes
        - recommendations
        - articles
        - newsletterSubscribers
        - contactEnquiries
        - collaborationEnquiries
        - productEnquiries
        - recentlyUpdated

    ProductVariant:
      type: object
      properties:
        label:
          type: string
        options:
          type: array
          items:
            type: string
      required:
        - label
        - options

    # --- Multi-variety / multi-option commerce model (additive, alongside legacy ProductVariant above) ---

    ProductOptionValue:
      type: object
      properties:
        id:
          type: number
        groupId:
          type: number
        label:
          type: string
        value:
          type: string
        displayOrder:
          type: number
        priceAdjustment:
          type: number
        sku:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
      required:
        - id
        - groupId
        - label
        - value
        - displayOrder
        - priceAdjustment
        - sku
        - imageUrl
        - description
        - isActive

    ProductOptionGroup:
      type: object
      properties:
        id:
          type: number
        productId:
          type: number
        key:
          type: string
        label:
          type: string
        displayOrder:
          type: number
        required:
          type: boolean
        helpText:
          type: ["string", "null"]
        isActive:
          type: boolean
        values:
          type: array
          items:
            $ref: "#/components/schemas/ProductOptionValue"
      required:
        - id
        - productId
        - key
        - label
        - displayOrder
        - required
        - helpText
        - isActive
        - values

    ProductImage:
      type: object
      properties:
        id:
          type: number
        productId:
          type: number
        varietyId:
          type: ["number", "null"]
        url:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        altText:
          type: ["string", "null"]
        caption:
          type: ["string", "null"]
        displayOrder:
          type: number
        isFeatured:
          type: boolean
      required:
        - id
        - productId
        - varietyId
        - url
        - thumbnailUrl
        - altText
        - caption
        - displayOrder
        - isFeatured

    ProductVariety:
      type: object
      properties:
        id:
          type: number
        productId:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        sku:
          type: ["string", "null"]
        priceOverride:
          type: ["number", "null"]
        shippingAmountOverride:
          type: ["number", "null"]
        availabilityOverride:
          type: ["string", "null"]
        displayOrder:
          type: number
        isActive:
          type: boolean
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
      required:
        - id
        - productId
        - name
        - description
        - sku
        - priceOverride
        - shippingAmountOverride
        - availabilityOverride
        - displayOrder
        - isActive
        - images

    ProductImageInput:
      type: object
      properties:
        url:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        altText:
          type: ["string", "null"]
        caption:
          type: ["string", "null"]
        displayOrder:
          type: number
        isFeatured:
          type: boolean
      required:
        - url

    ProductOptionValueInput:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        displayOrder:
          type: number
        priceAdjustment:
          type: number
        sku:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
      required:
        - label
        - value

    ProductOptionGroupInput:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        displayOrder:
          type: number
        required:
          type: boolean
        helpText:
          type: ["string", "null"]
        isActive:
          type: boolean
        values:
          type: array
          items:
            $ref: "#/components/schemas/ProductOptionValueInput"
      required:
        - key
        - label
        - values

    ProductVarietyInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        sku:
          type: ["string", "null"]
        priceOverride:
          type: ["number", "null"]
        shippingAmountOverride:
          type: ["number", "null"]
        availabilityOverride:
          type: ["string", "null"]
        displayOrder:
          type: number
        isActive:
          type: boolean
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImageInput"
      required:
        - name

    Product:
      type: object
      properties:
        id:
          type: number
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        shortDescription:
          type: ["string", "null"]
        price:
          type: number
        currency:
          type: string
        type:
          type: string
          enum: [digital, physical]
        category:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        images:
          type: array
          items:
            type: string
        previewImageUrl:
          type: ["string", "null"]
        availability:
          type: string
          enum: [available, preorder, coming_soon, out_of_stock]
        stockStatus:
          type: string
          enum: [in_stock, limited, out_of_stock]
        isFeatured:
          type: boolean
        downloadUrl:
          type: ["string", "null"]
        shippingAmount:
          type: number
        digitalDownloadPath:
          type: ["string", "null"]
        preorderOpensAt:
          type: ["string", "null"]
          format: date-time
        preorderClosesAt:
          type: ["string", "null"]
          format: date-time
        estimatedFulfilment:
          type: ["string", "null"]
        regions:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        optionGroups:
          type: array
          items:
            $ref: "#/components/schemas/ProductOptionGroup"
        varieties:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariety"
        gallery:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        externalPurchaseUrl:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ContentStatus"
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        seoTitle:
          type: ["string", "null"]
        seoDescription:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - title
        - description
        - shortDescription
        - price
        - currency
        - type
        - category
        - imageUrl
        - thumbnailUrl
        - images
        - previewImageUrl
