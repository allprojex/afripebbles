          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/podcast-episodes/{id}:
    get:
      operationId: adminGetPodcastEpisode
      tags: [admin]
      summary: Get a podcast episode by id regardless of status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastEpisode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: adminUpdatePodcastEpisode
      tags: [admin]
      summary: Update a podcast episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodcastEpisodeInput"
      responses:
        "200":
          description: Episode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastEpisode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeletePodcastEpisode
      tags: [admin]
      summary: Delete a podcast episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Admin: blog / articles
