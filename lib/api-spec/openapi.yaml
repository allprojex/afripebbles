  # ---------------------------------------------------------------------------
  # Public: orders (guest checkout, quote preview, tracking, digital download)
  # ---------------------------------------------------------------------------
  /orders/quote:
    post:
      operationId: quoteOrder
      tags: [orders]
      summary: Server-side authoritative price/availability preview for a cart (no order is created)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteOrderInput"
      responses:
        "200":
          description: Computed totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResult"
        "400":
          description: Invalid cart (unavailable product, bad variant, preorder window closed, invalid coupon, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a guest order. Prices/availability are re-validated and computed server-side; client-submitted amounts are never trusted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderWithItems"
        "400":
          description: Invalid cart or missing consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/track:
    post:
      operationId: trackOrder
      tags: [orders]
      summary: Look up an order by reference + email (never by id alone)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackOrderInput"
      responses:
        "200":
          description: Limited public order view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOrderTracking"
        "404":
          description: No matching order for that reference + email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/download:
    get:
      operationId: getOrderItemDownloadUrl
      tags: [orders]
      summary: Mint a short-lived signed download URL for a paid digital order item. Requires the matching email; never returns a permanent public URL.
      parameters:
        - name: orderReference
          in: query
          required: true
          schema:
            type: string
        - name: productId
          in: query
          required: true
          schema:
            type: number
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A signed, time-limited download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrlResponse"
        "403":
          description: Order isn't paid yet, or this product isn't a digital item on the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No matching order for that reference + email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

