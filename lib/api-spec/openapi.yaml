openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AfriPebbles API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Shop products (digital & physical pre-orders)
  - name: podcast
    description: Podcast episodes
  - name: blog
    description: Blog posts and inspirational content
  - name: curated
    description: Curated affiliate recommendations
  - name: newsletter
    description: Newsletter subscriptions
  - name: collaborations
    description: UGC collaboration enquiries
  - name: contact
    description: General contact enquiries
  - name: homepage
    description: Homepage summary data
  - name: settings
    description: Public site settings and homepage content
  - name: admin
    description: Admin-only content management (requires an admin bearer token)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------------------------------------------------------------------------
  # Public: products
  # ---------------------------------------------------------------------------
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List published products
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [digital, physical]
          description: Filter by product type
        - name: availability
          in: query
          schema:
            type: string
            enum: [available, preorder, coming_soon, out_of_stock]
          description: Filter by availability
        - name: featured
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter featured products only
      responses:
        "200":
          description: List of published products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a single published product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Public: podcast
  # ---------------------------------------------------------------------------
  /podcast-episodes:
    get:
      operationId: listPodcastEpisodes
      tags: [podcast]
      summary: List published podcast episodes
      parameters:
        - name: featured
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter featured episodes only
        - name: limit
          in: query
          schema:
            type: number
          description: Limit number of results
      responses:
        "200":
          description: List of published podcast episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodcastEpisode"

  /podcast-episodes/{id}:
    get:
      operationId: getPodcastEpisode
      tags: [podcast]
      summary: Get a single published podcast episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Episode details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastEpisode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Public: blog / journal
  # ---------------------------------------------------------------------------
  /blog-posts:
    get:
      operationId: listBlogPosts
      tags: [blog]
      summary: List published blog posts
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
        - name: featured
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter featured posts only
        - name: limit
          in: query
          schema:
            type: number
          description: Limit number of results
      responses:
        "200":
          description: List of published blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"

  /blog-posts/{slug}:
    get:
      operationId: getBlogPost
      tags: [blog]
      summary: Get a single published blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blog post details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Public: curated recommendations
  # ---------------------------------------------------------------------------
  /curated-picks:
    get:
      operationId: listCuratedPicks
      tags: [curated]
      summary: List published curated affiliate recommendations
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
      responses:
        "200":
          description: List of published curated picks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CuratedPick"

  # ---------------------------------------------------------------------------
  # Public: newsletter / collaboration / contact submissions
  # ---------------------------------------------------------------------------
  /newsletter-subscriptions:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "201":
          description: Subscribed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscription"
        "409":
          description: Already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /collaboration-enquiries:
    post:
      operationId: submitCollaborationEnquiry
      tags: [collaborations]
      summary: Submit a UGC collaboration enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollaborationEnquiryInput"
      responses:
        "201":
          description: Enquiry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationEnquiry"

  /contact-enquiries:
    post:
      operationId: submitContactEnquiry
      tags: [contact]
      summary: Submit a general contact enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEnquiryInput"
      responses:
        "201":
          description: Enquiry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnquiry"

  /homepage-summary:
    get:
      operationId: getHomepageSummary
      tags: [homepage]
      summary: Get homepage summary with featured content
      responses:
        "200":
          description: Homepage summary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageSummary"

  /site-settings:
    get:
      operationId: getSiteSettings
      tags: [settings]
      summary: Get public site settings (falls back to defaults when unset)
      responses:
        "200":
          description: Site settings, or null if none saved yet
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SiteSettings"
                  - type: "null"

  /homepage-content:
    get:
      operationId: getHomepageContent
      tags: [settings]
      summary: Get public homepage content overrides (falls back to defaults when unset)
      responses:
        "200":
          description: Homepage content, or null if none saved yet
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HomepageContent"
                  - type: "null"

  # ---------------------------------------------------------------------------
  # Admin: identity / dashboard
  # ---------------------------------------------------------------------------
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Confirm the current bearer token belongs to an admin
      responses:
        "200":
          description: The authenticated admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated but not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Real content and enquiry counts for the admin dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ---------------------------------------------------------------------------
  # Admin: products
  # ---------------------------------------------------------------------------
  /admin/products:
    get:
      operationId: adminListProducts
      tags: [admin]
      summary: List all products regardless of status
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContentStatus"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: All products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: adminCreateProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/products/{id}:
    get:
      operationId: adminGetProduct
      tags: [admin]
      summary: Get a product by id regardless of status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: adminUpdateProduct
      tags: [admin]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteProduct
      tags: [admin]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Admin: podcast
  # ---------------------------------------------------------------------------
  /admin/podcast-episodes:
    get:
      operationId: adminListPodcastEpisodes
      tags: [admin]
      summary: List all podcast episodes regardless of status
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContentStatus"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: All podcast episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodcastEpisode"
    post:
      operationId: adminCreatePodcastEpisode
      tags: [admin]
      summary: Create a podcast episode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodcastEpisodeInput"
      responses:
        "201":
          description: Episode created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastEpisode"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/podcast-episodes/{id}:
    get:
      operationId: adminGetPodcastEpisode
      tags: [admin]
      summary: Get a podcast episode by id regardless of status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastEpisode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: adminUpdatePodcastEpisode
      tags: [admin]
      summary: Update a podcast episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodcastEpisodeInput"
      responses:
        "200":
          description: Episode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastEpisode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeletePodcastEpisode
      tags: [admin]
      summary: Delete a podcast episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Admin: blog / articles
  # ---------------------------------------------------------------------------
  /admin/blog-posts:
    get:
      operationId: adminListBlogPosts
      tags: [admin]
      summary: List all blog posts regardless of status
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContentStatus"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: All blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"
    post:
      operationId: adminCreateBlogPost
      tags: [admin]
      summary: Create a blog post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/blog-posts/{id}:
    get:
      operationId: adminGetBlogPost
      tags: [admin]
      summary: Get a blog post by id regardless of status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: adminUpdateBlogPost
      tags: [admin]
      summary: Update a blog post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostInput"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteBlogPost
      tags: [admin]
      summary: Delete a blog post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Admin: curated recommendations
  # ---------------------------------------------------------------------------
  /admin/curated-picks:
    get:
      operationId: adminListCuratedPicks
      tags: [admin]
      summary: List all curated picks regardless of status
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContentStatus"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: All curated picks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CuratedPick"
    post:
      operationId: adminCreateCuratedPick
      tags: [admin]
      summary: Create a curated pick
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuratedPickInput"
      responses:
        "201":
          description: Pick created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuratedPick"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/curated-picks/{id}:
    get:
      operationId: adminGetCuratedPick
      tags: [admin]
      summary: Get a curated pick by id regardless of status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Pick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuratedPick"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: adminUpdateCuratedPick
      tags: [admin]
      summary: Update a curated pick
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuratedPickInput"
      responses:
        "200":
          description: Pick updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuratedPick"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteCuratedPick
      tags: [admin]
      summary: Delete a curated pick
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Admin: homepage content & site settings (singleton resources)
  # ---------------------------------------------------------------------------
  /admin/homepage-content:
    get:
      operationId: adminGetHomepageContent
      tags: [admin]
      summary: Get the homepage content overrides
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageContent"
    put:
      operationId: adminUpdateHomepageContent
      tags: [admin]
      summary: Upsert the homepage content overrides
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomepageContentInput"
      responses:
        "200":
          description: Homepage content saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageContent"

  /admin/site-settings:
    get:
      operationId: adminGetSiteSettings
      tags: [admin]
      summary: Get site settings
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    put:
      operationId: adminUpdateSiteSettings
      tags: [admin]
      summary: Upsert site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsInput"
      responses:
        "200":
          description: Site settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  # ---------------------------------------------------------------------------
  # Admin: enquiries & newsletter
  # ---------------------------------------------------------------------------
  /admin/contact-enquiries:
    get:
      operationId: adminListContactEnquiries
      tags: [admin]
      summary: List contact enquiries (product enquiries are inquiryType=product)
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EnquiryStatus"
        - name: inquiryType
          in: query
          schema:
            type: string
            enum: [general, collaboration, order-support, product]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Contact enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactEnquiry"

  /admin/contact-enquiries/{id}:
    patch:
      operationId: adminUpdateContactEnquiry
      tags: [admin]
      summary: Update a contact enquiry's status/notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryUpdateInput"
      responses:
        "200":
          description: Enquiry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnquiry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/collaboration-enquiries:
    get:
      operationId: adminListCollaborationEnquiries
      tags: [admin]
      summary: List collaboration enquiries
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EnquiryStatus"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Collaboration enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollaborationEnquiry"

  /admin/collaboration-enquiries/{id}:
    patch:
      operationId: adminUpdateCollaborationEnquiry
      tags: [admin]
      summary: Update a collaboration enquiry's status/notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryUpdateInput"
      responses:
        "200":
          description: Enquiry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationEnquiry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/newsletter-subscriptions:
    get:
      operationId: adminListNewsletterSubscriptions
      tags: [admin]
      summary: List newsletter subscribers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
