openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AfriPebbles API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Shop products (digital & physical pre-orders)
  - name: podcast
    description: Podcast episodes
  - name: blog
    description: Blog posts and inspirational content
  - name: curated
    description: Curated affiliate recommendations
  - name: ugc
    description: AfriPebbles UGC portfolio
  - name: testimonials
    description: Client/collaborator testimonials
  - name: newsletter
    description: Newsletter subscriptions
  - name: collaborations
    description: UGC collaboration enquiries
  - name: contact
    description: General contact enquiries
  - name: homepage
    description: Homepage summary data
  - name: settings
    description: Public site settings and homepage content
  - name: orders
    description: Guest checkout, order creation, and public order tracking
  - name: coupons
    description: Coupon code preview (validation is authoritative server-side at order creation)
  - name: admin
    description: Admin-only content management (requires an admin bearer token)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------------------------------------------------------------------------
  # Public: products
  # ---------------------------------------------------------------------------
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List published products
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [digital, physical]
          description: Filter by product type
        - name: availability
          in: query
          schema:
            type: string
            enum: [available, preorder, coming_soon, out_of_stock]
          description: Filter by availability
        - name: featured
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter featured products only
      responses:
        "200":
          description: List of published products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProduct"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a single published product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProduct"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Public: podcast
  # ---------------------------------------------------------------------------
  /podcast-episodes:
    get:
      operationId: listPodcastEpisodes
      tags: [podcast]
      summary: List published podcast episodes
      parameters:
        - name: featured
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter featured episodes only
        - name: limit
          in: query
          schema:
            type: number
          description: Limit number of results
      responses:
        "200":
          description: List of published podcast episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodcastEpisode"

  /podcast-episodes/{id}:
    get:
      operationId: getPodcastEpisode
      tags: [podcast]
      summary: Get a single published podcast episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Episode details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastEpisode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Public: blog / journal
  # ---------------------------------------------------------------------------
  /blog-posts:
    get:
      operationId: listBlogPosts
      tags: [blog]
      summary: List published blog posts
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
        - name: featured
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter featured posts only
        - name: limit
          in: query
          schema:
            type: number
          description: Limit number of results
      responses:
        "200":
          description: List of published blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"

  /blog-posts/{slug}:
    get:
      operationId: getBlogPost
      tags: [blog]
      summary: Get a single published blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blog post details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Public: curated recommendations
  # ---------------------------------------------------------------------------
  /curated-picks:
    get:
      operationId: listCuratedPicks
      tags: [curated]
      summary: List published curated affiliate recommendations
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
      responses:
        "200":
          description: List of published curated picks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CuratedPick"

  # ---------------------------------------------------------------------------
  # Public: UGC portfolio
  # ---------------------------------------------------------------------------
  /ugc-entries:
    get:
      operationId: listUgcEntries
      tags: [ugc]
      summary: List published UGC portfolio entries
      responses:
        "200":
          description: List of published UGC entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UgcEntry"

  # ---------------------------------------------------------------------------
  # Public: testimonials
  # ---------------------------------------------------------------------------
  /testimonials:
    get:
      operationId: listTestimonials
      tags: [testimonials]
      summary: List published testimonials
      responses:
        "200":
          description: List of published testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"

  # ---------------------------------------------------------------------------
  # Public: newsletter / collaboration / contact submissions
  # ---------------------------------------------------------------------------
  /newsletter-subscriptions:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "201":
          description: Subscribed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscription"
        "409":
          description: Already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter-subscriptions/unsubscribe:
    post:
      operationId: unsubscribeNewsletter
      tags: [newsletter]
      summary: Unsubscribe using the token from an unsubscribe link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterUnsubscribeInput"
      responses:
        "200":
          description: Unsubscribed (or already was — idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscription"
        "404":
          description: Unknown token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /collaboration-enquiries:
    post:
      operationId: submitCollaborationEnquiry
      tags: [collaborations]
      summary: Submit a UGC collaboration enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollaborationEnquiryInput"
      responses:
        "201":
          description: Enquiry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationEnquiry"

  /contact-enquiries:
    post:
      operationId: submitContactEnquiry
      tags: [contact]
      summary: Submit a general contact enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEnquiryInput"
      responses:
        "201":
          description: Enquiry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnquiry"

  /homepage-summary:
    get:
      operationId: getHomepageSummary
      tags: [homepage]
      summary: Get homepage summary with featured content
      responses:
        "200":
          description: Homepage summary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageSummary"

  /site-settings:
    get:
      operationId: getSiteSettings
      tags: [settings]
      summary: Get public site settings (falls back to defaults when unset)
      responses:
        "200":
          description: Site settings, or null if none saved yet
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SiteSettings"
                  - type: "null"

  /homepage-content:
    get:
      operationId: getHomepageContent
      tags: [settings]
      summary: Get public homepage content overrides (falls back to defaults when unset)
      responses:
        "200":
          description: Homepage content, or null if none saved yet
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HomepageContent"
                  - type: "null"

  # ---------------------------------------------------------------------------
  # Admin: identity / dashboard
  # ---------------------------------------------------------------------------
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Confirm the current bearer token belongs to an admin
      responses:
        "200":
          description: The authenticated admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated but not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Real content and enquiry counts for the admin dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ---------------------------------------------------------------------------
  # Admin: products
  # ---------------------------------------------------------------------------
  /admin/products:
    get:
      operationId: adminListProducts
      tags: [admin]
      summary: List all products regardless of status
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContentStatus"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: All products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: adminCreateProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/products/{id}:
    get:
      operationId: adminGetProduct
      tags: [admin]
      summary: Get a product by id regardless of status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: adminUpdateProduct
      tags: [admin]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteProduct
      tags: [admin]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Admin: podcast
  # ---------------------------------------------------------------------------
  /admin/podcast-episodes:
    get:
      operationId: adminListPodcastEpisodes
      tags: [admin]
      summary: List all podcast episodes regardless of status
