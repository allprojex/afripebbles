          description: All UGC entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UgcEntry"
    post:
      operationId: adminCreateUgcEntry
      tags: [admin]
      summary: Create a UGC entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UgcEntryInput"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UgcEntry"

  /admin/ugc-entries/{id}:
    get:
      operationId: adminGetUgcEntry
      tags: [admin]
      summary: Get a UGC entry by id regardless of status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UgcEntry"
        "404":
